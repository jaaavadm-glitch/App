name: Build APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install build tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Create project
        run: |
          mkdir -p project/src/com/mahmod/app
          mkdir -p project/res/values
          mkdir -p project/res/drawable
          mkdir -p project/assets
          mkdir -p project/build/apk

      - name: Write HTML content
        run: |
          cat > project/assets/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html dir="rtl" lang="fa">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>${{ github.event.client_payload.app_name }}</title>
          <style>
          *{margin:0;padding:0;box-sizing:border-box}
          html,body{width:100%;min-height:100vh;font-family:tahoma,sans-serif;background:#0a0a0f;color:#fff;direction:rtl;padding:20px}
          body{background:radial-gradient(circle at 20% 10%,rgba(138,43,226,.35),transparent 45%),radial-gradient(circle at 80% 90%,rgba(199,125,255,.25),transparent 50%),#0a0a0f}
          h1{font-size:28px;font-weight:bold;margin-bottom:15px;text-shadow:0 0 20px rgba(199,125,255,.6);text-align:center;color:#c77dff}
          p{font-size:16px;line-height:2;margin-bottom:10px}
          img{max-width:100%;border-radius:12px;display:block;margin:15px auto}
          .element{background:rgba(138,43,226,.15);border:1px solid rgba(199,125,255,.3);border-radius:16px;padding:18px;margin:15px 0}
          </style>
          </head>
          <body>
          <h1>${{ github.event.client_payload.app_name }}</h1>
          ${{ github.event.client_payload.html_content }}
          </body>
          </html>
          HTMLEOF

      - name: Write icon
        run: |
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > project/res/drawable/icon.png
          if [ -n "${{ github.event.client_payload.icon_base64 }}" ]; then
            echo "${{ github.event.client_payload.icon_base64 }}" | base64 -d > /tmp/user_icon.png 2>/dev/null
            if file /tmp/user_icon.png 2>/dev/null | grep -q "PNG"; then
              if [ $(wc -c < /tmp/user_icon.png) -gt 100 ]; then
                cp /tmp/user_icon.png project/res/drawable/icon.png
              fi
            fi
          fi

      - name: Write manifest
        run: |
          cat > project/AndroidManifest.xml << 'MANIFESTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="${{ github.event.client_payload.package_name }}"
              android:versionCode="1" android:versionName="1.0">
              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="28" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="${{ github.event.client_payload.app_name }}"
                  android:icon="@drawable/icon"
                  android:theme="@android:style/Theme.Black.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFESTEOF

      - name: Write MainActivity.java
        run: |
          cat > project/src/com/mahmod/app/MainActivity.java << 'JAVAEOF'
          package com.mahmod.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  WebView w = new WebView(this);
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  w.loadUrl("file:///android_asset/index.html");
                  setContentView(w);
              }
          }
          JAVAEOF

      - name: Build APK
        run: |
          cd project
          BT=$ANDROID_HOME/build-tools/34.0.0
          AJ=$ANDROID_HOME/platforms/android-34/android.jar
          $BT/aapt2 compile --dir res -o build/res.zip
          $BT/aapt2 link -o build/apk/base.apk -I $AJ --manifest AndroidManifest.xml --auto-add-overlay -R build/res.zip
          javac -source 1.8 -target 1.8 -cp $AJ -d build/classes src/com/mahmod/app/MainActivity.java
          $BT/d8 --min-api 21 --output build/dex build/classes/com/mahmod/app/*.class
          cd build/apk
          cp ../dex/classes.dex .
          cp -r ../../assets assets
          zip -r base.apk classes.dex assets
          $BT/zipalign -f 4 base.apk aligned.apk
          keytool -genkey -v -keystore test.keystore -alias test -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Mahmod"
          $BT/apksigner sign --ks test.keystore --ks-pass pass:123456 --min-sdk-version 21 --out final.apk aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: project/build/apk/final.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ github.event.client_payload.app_name }}
          files: project/build/apk/final.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
