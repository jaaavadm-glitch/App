name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
      package_name:
        description: 'Package Name'
        required: true
      html_content:
        description: 'HTML Content'
        required: true
      icon_base64:
        description: 'Icon Base64'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Create project structure
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/java/com/mahmod/app
          
          # ذخیره‌ی HTML
          echo '${{ github.event.inputs.html_content }}' > app/src/main/assets/index.html
          
          # ذخیره‌ی آیکون
          if [ -n "${{ github.event.inputs.icon_base64 }}" ]; then
            echo '${{ github.event.inputs.icon_base64 }}' | base64 -d > app/src/main/res/drawable/icon.png
          fi
      
      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="${{ github.event.inputs.package_name }}">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="${{ github.event.inputs.app_name }}"
                  android:icon="@drawable/icon">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST
      
      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/mahmod/app/MainActivity.java << 'JAVA'
          package com.mahmod.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  WebView w = new WebView(this);
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  w.loadUrl("file:///android_asset/index.html");
                  setContentView(w);
              }
          }
          JAVA
      
      - name: Build APK
        run: |
          # نصب ابزارها
          sdkmanager "build-tools;34.0.0" "platforms;android-34"
          
          # مسیرها
          BT=$ANDROID_HOME/build-tools/34.0.0
          AJ=$ANDROID_HOME/platforms/android-34/android.jar
          
          # کامپایل منابع
          $BT/aapt2 compile --dir app/src/main/res -o app/res.zip
          $BT/aapt2 link -o app/base.apk -I $AJ \
            --manifest app/src/main/AndroidManifest.xml \
            -R app/res.zip
          
          # کامپایل جاوا
          javac -source 1.8 -target 1.8 -cp $AJ -d app/classes \
            app/src/main/java/com/mahmod/app/MainActivity.java
          
          # به dex
          $BT/d8 --min-api 21 --output app/dex app/classes/com/mahmod/app/*.class
          
          # ساخت APK نهایی
          cd app
          cp dex/classes.dex .
          zip -r base.apk classes.dex assets
          $BT/zipalign -f 4 base.apk aligned.apk
          
          # امضا با keystore موقت
          keytool -genkey -v -keystore test.keystore -alias test \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=Test"
          
          $BT/apksigner sign --ks test.keystore --ks-pass pass:123456 \
            --out final.apk aligned.apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/final.apk
